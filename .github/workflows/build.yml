name: Build Electron App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build and Package App
        # ប្រើ Script ដែលគម្រោងដើមបានត្រៀមទុកសម្រាប់ការបង្កើត Installer
        run: pnpm --filter xmcl-electron-app run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installer
          # រកមើល File Installer នៅគ្រប់ទីកន្លែងដែលអាចមាន
          path: |
            **/*.exe
            **/*.AppImage
            **/*.dmg
            **/*.zip
          retention-days: 7
