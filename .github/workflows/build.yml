name: Build Electron App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build Electron app
        run: pnpm --filter xmcl-electron-app build
        
      - name: Package Installer (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: pnpm --filter xmcl-electron-app exec electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter xmcl-electron-app exec electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installer
          # យើងបន្ថែមផ្លូវស្វែងរកឱ្យកាន់តែទូលំទូលាយ
          path: |
            dist/**/*
            xmcl-electron-app/dist/**/*
            xmcl-electron-app/release/**/*
            **/*.exe
            **/*.AppImage
            **/*.dmg
          retention-days: 7
